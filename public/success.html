<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merci — G.KECOM</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --black:#0e0d0c; --cream:#f2efe9; --gold:#c9a35c; --taupe:#6b645c; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--black); color: var(--cream);
    font-family: 'Jost', sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  .medallion {
    width: 100px; height: 100px; border: 1px solid var(--gold); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cormorant Garamond', serif; font-size: 32px; color: var(--gold);
    margin: 0 auto 32px;
  }
  h1 { font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: 42px; margin-bottom: 16px; }
  p { color: var(--taupe); font-size: 15px; max-width: 420px; margin: 0 auto 32px; line-height: 1.7; }
  a {
    display: inline-block; background: var(--gold); color: var(--black);
    text-decoration: none; padding: 16px 36px;
    font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
  }
</style>
</head>
<body>
  <div>
    <div class="medallion">G·K</div>
    <h1>Merci pour votre commande</h1>
    <p>Votre paiement a bien été confirmé. Vous recevrez un e-mail de confirmation avec le suivi de votre commande très prochainement ✦</p>
    <a href="/">Retour à la boutique</a>
  </div>
</body>
</html>
